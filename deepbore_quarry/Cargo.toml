[package]
name = "mod-deepbore_quarry"
version = "0.4.6"
edition = "2024"
license = "MIT"
publish = false
description = "Deepbore Quarry for Sunrise: a machine that digs a square pit down to bedrock and fills a chest."

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
